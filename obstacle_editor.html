<!DOCTYPE html>
<html>
<head>
    <title>Obstacle Editor for Snake Game</title>
    <style>
        #editorCanvas {
            border: 1px solid black;
        }
        .obstacle {
            border: 1px solid red;
            position: absolute;
        }
        .resize-handle {
            width: 10px;
            height: 10px;
            background-color: blue;
            position: absolute;
            right: -5px;
            bottom: -5px;
            cursor: se-resize;
        }
    </style>
</head>
<body>
    <div id="canvasContainer" style="position: relative;">
        <canvas id="editorCanvas" width="1440" height="900"></canvas>
    </div>
    <button id="exportButton">Export Obstacles</button>

    <script src="obstacle_editor.js"></script>
</body>
</html>
